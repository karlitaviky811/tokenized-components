<button
  class="ui-icon-btn"
  [attr.type]="type()"
  [disabled]="disabled()"
  matRipple
  [matRippleDisabled]="disabled()"
  [matRippleCentered]="true"
  [ngClass]="classes()"
  [attr.aria-pressed]="toggle() ? selected() : null"
>
  <span class="ui-icon-btn__content">
    <ng-content></ng-content>
  </span>
</button>
