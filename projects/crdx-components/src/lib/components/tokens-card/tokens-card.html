<article class="tokens-card" aria-label="Design system tokens overview">
  <section class="tokens-card__hero" aria-live="polite">
    <div class="tokens-card__hero-glow tokens-card__hero-glow--top" aria-hidden="true"></div>
    <div class="tokens-card__hero-glow tokens-card__hero-glow--bottom" aria-hidden="true"></div>

    <div class="tokens-card__hero-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
        <path
          d="M12 4L4 8.5V15.5L12 20L20 15.5V8.5L12 4Z"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
        <path
          d="M12 4V12M12 12L20 8.5M12 12L4 8.5M12 12V20"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <div class="tokens-card__hero-copy">
      <h2 class="tokens-card__hero-title">{{ activeSlide().title }}</h2>mcp
      <p class="tokens-card__hero-subtitle">{{ activeSlide().subtitle }}</p>
    </div>

    <div class="tokens-card__indicators" role="tablist" aria-label="Token categories">
      @for (slide of slides(); track slide.title; let i = $index) {
        <button
          type="button"
          class="tokens-card__indicator"
          [class.tokens-card__indicator--active]="activeIndex() === i"
          role="tab"
          [attr.aria-selected]="activeIndex() === i"
          [attr.aria-label]="slide.title"
          (click)="selectSlide(i)"
        ></button>
      }
    </div>
  </section>

  <section class="tokens-card__content">
    <p class="tokens-card__eyebrow">Design system</p>

    <div class="tokens-card__sections">
      <div class="tokens-card__section">
        <div class="tokens-card__section-head">
          <span class="tokens-card__section-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
              <path
                d="M12 3C8.5 3 6 5.5 6 9C6 12 8 14.5 11 15V18C11 18.55 11.45 19 12 19C12.55 19 13 18.55 13 18V15C16 14.5 18 12 18 9C18 5.5 15.5 3 12 3Z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="8.5" cy="8.5" r="1.25" fill="currentColor" />
              <circle cx="12" cy="6.75" r="1.25" fill="currentColor" />
              <circle cx="15.5" cy="9.5" r="1.25" fill="currentColor" />
            </svg>
          </span>
          <span class="tokens-card__section-label">Colors</span>
        </div>
        <div class="tokens-card__swatches" aria-hidden="true">
          <span class="tokens-card__swatch tokens-card__swatch--primary"></span>
          <span class="tokens-card__swatch tokens-card__swatch--navy"></span>
          <span class="tokens-card__swatch tokens-card__swatch--surface"></span>
          <span class="tokens-card__swatch tokens-card__swatch--white"></span>
        </div>
      </div>

      <div class="tokens-card__section">
        <div class="tokens-card__section-head">
          <span class="tokens-card__section-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
              <path d="M6 5H18V8H6V5Z" fill="currentColor" />
              <path d="M6 10.5H14V13H6V10.5Z" fill="currentColor" opacity="0.72" />
              <path d="M6 15.5H11V18H6V15.5Z" fill="currentColor" opacity="0.48" />
            </svg>
          </span>
          <span class="tokens-card__section-label">Typography</span>
        </div>
        <div class="tokens-card__type-preview" aria-hidden="true">
          <span class="tokens-card__type-bar tokens-card__type-bar--lg"></span>
          <span class="tokens-card__type-bar tokens-card__type-bar--md"></span>
          <span class="tokens-card__type-bar tokens-card__type-bar--sm"></span>
        </div>
      </div>

      <div class="tokens-card__section">
        <div class="tokens-card__section-head">
          <span class="tokens-card__section-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
              <rect x="4" y="4" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" />
              <rect x="14" y="4" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" />
              <rect x="4" y="14" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" />
              <rect x="14" y="14" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </span>
          <span class="tokens-card__section-label">Spacing</span>
        </div>
        <div class="tokens-card__spacing-preview" aria-hidden="true">
          <span class="tokens-card__spacing-bar tokens-card__spacing-bar--1"></span>
          <span class="tokens-card__spacing-bar tokens-card__spacing-bar--2"></span>
          <span class="tokens-card__spacing-bar tokens-card__spacing-bar--3"></span>
          <span class="tokens-card__spacing-bar tokens-card__spacing-bar--4"></span>
          <span class="tokens-card__spacing-bar tokens-card__spacing-bar--5"></span>
        </div>
      </div>
    </div>

    <div class="tokens-card__tag">
      <span class="tokens-card__tag-dot" aria-hidden="true"></span>
      <span>Tokens</span>
    </div>
  </section>
</article>
