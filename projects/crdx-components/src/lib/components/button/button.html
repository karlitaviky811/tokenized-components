<ng-template #inputContent>
  <div class="lib-mat-btn__content">
    @if (iconPosition() === 'leading' && icon()) {
      <mat-icon [svgIcon]="icon()">{{ icon() }}</mat-icon>
    }
    @if (label()) {
      <span [class]="labelClass()">{{ label() }}</span>
    }
    @if (iconPosition() === 'trailing' && icon()) {
      <mat-icon [svgIcon]="icon()">{{ icon() }}</mat-icon>
    }
  </div>
</ng-template>

<button
  [matButton]="variant()"
  class="lib-mat-btn"
  [attr.type]="type()"
  [disabled]="disabled()"
  [ngClass]="classes()"
  [attr.aria-pressed]="toggle() ? selected() : null"
  (pointerdown)="onPressStart()"
  (pointerup)="onPressEnd()"
  (pointerleave)="onPressCancel()"
  (pointercancel)="onPressCancel()"
  (keydown)="onKeyDown($event)"
  (keyup)="onKeyUp()"
  (blur)="onPressEnd()"
>
  @if (hasInputContent()) {
    <ng-container [ngTemplateOutlet]="inputContent"></ng-container>
  } @else {
    <ng-content></ng-content>
  }
</button>
