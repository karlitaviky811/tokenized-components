<div
  class="container"
  role="dialog"
  aria-modal="true"
  [class.container--open]="rendered() && dialogState() === 'open'"
  (transitionend)="onTransitionEnd($event)"
>
  @if (showDragHandle) {
    <div class="header">
      <div class="drag-handle" aria-hidden="true"></div>
    </div>
  }
  <div class="content">
    <ng-container *ngComponentOutlet="content"></ng-container>
  </div>
</div>
