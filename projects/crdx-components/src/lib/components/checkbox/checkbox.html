<div
  class="lib-checkbox__wrapper"
  [class.lib-checkbox--disabled]="disabled()"
>

  <mat-checkbox
    [checked]="checked()"
    [indeterminate]="indeterminate()"
    [disabled]="disabled()"
    [class.es-error]="error()"
    (change)="onMatCheckboxChange($event)"
  >
    <ng-content />
  </mat-checkbox>
</div>
