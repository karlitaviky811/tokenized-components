<div class="lib-dph">
  <div class="lib-dph__group">
    <button
      mat-icon-button
      type="button"
      class="lib-dph__nav"
      [disabled]="!previousMonthEnabled()"
      (click)="previousMonth()"
      aria-label="Previous month"
    >
      <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
      </svg>
    </button>

    <button
      mat-button
      type="button"
      class="lib-dph__period lib-dph__period--month"
      (click)="toggleMonthView()"
      aria-label="Choose month"
    >
      <span>{{ monthLabel() }}</span>
      <svg class="lib-dph__arrow" viewBox="0 0 10 5" focusable="false" aria-hidden="true">
        <polygon points="0,0 5,5 10,0" />
      </svg>
    </button>

    <button
      mat-icon-button
      type="button"
      class="lib-dph__nav"
      [disabled]="!nextMonthEnabled()"
      (click)="nextMonth()"
      aria-label="Next month"
    >
      <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
      </svg>
    </button>
  </div>

  <div class="lib-dph__group">
    <button
      mat-icon-button
      type="button"
      class="lib-dph__nav"
      [disabled]="!previousYearEnabled()"
      (click)="previousYear()"
      aria-label="Previous year"
    >
      <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
      </svg>
    </button>

    <button
      mat-button
      type="button"
      class="lib-dph__period"
      (click)="toggleYearView()"
      aria-label="Choose year"
    >
      <span>{{ yearLabel() }}</span>
      <svg class="lib-dph__arrow" viewBox="0 0 10 5" focusable="false" aria-hidden="true">
        <polygon points="0,0 5,5 10,0" />
      </svg>
    </button>

    <button
      mat-icon-button
      type="button"
      class="lib-dph__nav"
      [disabled]="!nextYearEnabled()"
      (click)="nextYear()"
      aria-label="Next year"
    >
      <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
      </svg>
    </button>
  </div>
</div>
