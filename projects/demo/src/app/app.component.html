<div class="shell">
  <nav class="shell__nav">
    <div class="shell__brand">
      <div class="shell__brand-icon">C</div>
      <span class="shell__brand-name">Credix DS</span>
    </div>

    <div class="shell__groups">
      @for (group of groups; track group.label) {
        <div class="shell__group">
          <span class="shell__group-label">{{ group.label }}</span>

          @for (item of group.items; track item.label) {
            @if (item.path) {
              <a
                class="shell__link"
                [routerLink]="item.path"
                routerLinkActive="shell__link--active"
              >
                {{ item.label }}
              </a>
            } @else {
              <span class="shell__link shell__link--soon">
                {{ item.label }}
                <span class="shell__badge">soon</span>
              </span>
            }
          }
        </div>
      }
    </div>
  </nav>

  <main class="shell__content">
    <router-outlet />
  </main>
</div>
